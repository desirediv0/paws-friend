name: Deploy paws friend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
    
      # ------------------------------
      # FRONTEND SETUP
      # ------------------------------
      - name: Clean npm cache & remove existing dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          
      - name: Install frontend dependencies
        run: npm install
        
      - name: Create frontend .env file
        run: |
          touch .env
          echo "${{ secrets.PROD_FRONTEND_ENV }}" > .env
          
      - name: Build frontend
        run: npm run build
        
      # ------------------------------
      # PM2 DEPLOYMENT
      # ------------------------------
      - name: Create logs directory
        run: mkdir -p logs
        
      - name: Install PM2 globally (if not exists)
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          
          if ! command -v pm2 &> /dev/null; then
            echo "Installing PM2..."
            npm install -g pm2
          fi
          pm2 --version
          
      - name: Deploy with PM2
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          
          pm2 stop paws-friend 2>/dev/null || true
          pm2 delete paws-friend 2>/dev/null || true
          
          pm2 start ecosystem.config.js --env production
          pm2 save
          
      - name: Setup PM2 startup (if needed)
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          
          /home/runner/.nvm/versions/node/v22.18.0/bin/pm2 startup systemd --user --hp $HOME || true

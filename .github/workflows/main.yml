name: Deploy paws friend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    strategy:
      matrix:
        node-version: [22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
    
      # ------------------------------
      # FRONTEND SETUP
      # ------------------------------
      - name: Clean npm cache & remove existing dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
          
      - name: Install frontend dependencies
        run: npm install
        
      - name: Create frontend .env file
        run: |
          touch .env
          echo "${{ secrets.PROD_FRONTEND_ENV }}" > .env
          
      - name: Build frontend
        run: npm run build
        
      # ------------------------------
      # PM2 DEPLOYMENT (YOUR CONFIG)
      # ------------------------------
      - name: Create logs directory
        run: mkdir -p logs
        
      - name: Deploy with PM2 (Using your ecosystem.config.js)
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          
          # Proper working directory
          cd /home/runner/pawsfriend/_work/paws-friend/paws-friend
          
          # PM2 path
          PM2_PATH="/home/runner/.nvm/versions/node/v22.18.0/bin/pm2"
          
          # Stop and delete existing process
          $PM2_PATH stop paws-friend || true
          $PM2_PATH delete paws-friend || true
          
          # Start fresh
          $PM2_PATH start ecosystem.config.js --env production
          
          # Save and show status
          $PM2_PATH save
          $PM2_PATH status
          $PM2_PATH logs paws-friend --lines 10